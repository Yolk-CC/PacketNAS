plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pocketnas.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pocketnas.server"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // 人脸识别需要真实文件路径（purego dlopen）：确保 libonnxruntime.so
    // 安装时被解压到 nativeLibraryDir，而不是直接映射在 APK 内
    packagingOptions {
        jniLibs.useLegacyPackaging = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // gomobile bind output: place pocketnas.aar into app/libs/
    // (gomobile bind -target=android/arm64 -androidapi 26 -o app/libs/pocketnas.aar pocket-nas/mobile)
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'androidx.activity:activity:1.9.2'
}
