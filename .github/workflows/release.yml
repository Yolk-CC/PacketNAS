name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  release-binaries:
    name: Build & upload binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, out: pocket-nas-linux-amd64 }
          - { goos: linux, goarch: arm64, out: pocket-nas-linux-arm64 }
          - { goos: windows, goarch: amd64, out: pocket-nas-windows-amd64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
              -ldflags "-s -w -X main.Version=$VERSION -X pocket-nas/internal/files.Version=$VERSION" \
              -o dist/${{ matrix.out }} ./cmd/pocket-nas
      # M11: optional real-model smoke on linux/amd64. Model/runtime downloads
      # are cached; failures never block the release.
      - name: Cache M11 models (onnxruntime + buffalo_s + test photos)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pocketnas-m11
          key: m11-buffalo_s-ort-1.17.3
      - name: M11 faces smoke (optional)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        continue-on-error: true
        run: M11_CACHE=$HOME/.cache/pocketnas-m11 bash scripts/smoke-m11.sh
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.out }}

  android-apk:
    name: Build & upload Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install gomobile
        run: |
          # 与 go.mod 中 x/mobile 同版本，避免新版 gomobile 的 tool 指令检查（go 1.24+）
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20241108191957-fa514ef75a0f
          gomobile init
      - name: Build Go core .aar
        run: |
          mkdir -p android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 \
            -o android/app/libs/pocketnas.aar ./mobile
      # M11: bundle onnxruntime-mobile so Android gets face recognition.
      # Optional per SPEC-M11 §5: failure leaves faces_unavailable degrade.
      - name: Bundle onnxruntime-mobile .so (optional)
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a /tmp/ort-aar
          curl -fsSL -o /tmp/ort.aar \
            https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.17.3/onnxruntime-android-1.17.3.aar
          unzip -o /tmp/ort.aar jni/arm64-v8a/libonnxruntime.so -d /tmp/ort-aar
          cp /tmp/ort-aar/jni/arm64-v8a/libonnxruntime.so \
            android/app/src/main/jniLibs/arm64-v8a/
      - name: Assemble APK
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK artifact
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/pocketnas-server-debug.apk
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/pocketnas-server-debug.apk

  client-apk:
    name: Build & upload client APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble client APK
        working-directory: client-android
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew assembleDebug --no-daemon
      - name: Run client unit tests
        working-directory: client-android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Rename APK artifact
        run: |
          mv client-android/app/build/outputs/apk/debug/app-debug.apk \
            client-android/app/build/outputs/apk/debug/pocketnas-client-debug.apk
      - name: Upload client APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: client-android/app/build/outputs/apk/debug/pocketnas-client-debug.apk
