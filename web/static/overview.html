<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(function(){var t=localStorage.getItem('pocket-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;})();</script>
<title>PocketNAS 总览</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录视图（独立，不进导航） -->
<div id="login-view" class="hidden">
  <div class="login-card">
    <h1>PocketNAS</h1>
    <p class="muted">请输入访问密码</p>
    <form id="login-form">
      <div class="pwd-wrap">
        <input type="password" id="login-password" class="input" placeholder="密码" autocomplete="current-password" required>
        <button type="button" class="pwd-eye" id="login-eye" aria-label="显示密码">
          <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" class="btn primary">登录</button>
    </form>
    <p id="login-error" class="error-text hidden"></p>
  </div>
</div>

<!-- 主视图 -->
<div id="main-view" class="hidden">
  <aside class="sidenav">
    <a class="brand" href="overview.html">PocketNAS</a>
    <a class="nav-item" href="overview.html"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>总览</a>
    <a class="nav-item" href="files.html"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>文件</a>
    <a class="nav-item" href="library.html"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg>图库</a>
    <div class="nav-sub">
      <a class="nav-item sub" href="library.html?tab=photos">照片</a>
      <a class="nav-item sub" href="library.html?tab=people">人物</a>
      <a class="nav-item sub" href="library.html?tab=faces">识别中心<span class="badge warning hidden" id="nav-faces-badge"></span></a>
    </div>
    <a class="nav-item" href="shares.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>共享</a>
    <a class="nav-item" href="settings.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</a>
    <div class="nav-foot">
      <button class="icon-btn" data-action="toggle-theme" aria-label="切换主题"></button>
      <button class="icon-btn" data-action="logout" aria-label="退出登录"><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg></button>
    </div>
  </aside>

  <div class="mobile-topbar">
    <div class="m-row">
      <a class="brand" href="overview.html">PocketNAS</a>
      <div>
        <button class="icon-btn" data-action="toggle-theme" aria-label="切换主题"></button>
        <button class="icon-btn" data-action="logout" aria-label="退出登录"><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg></button>
      </div>
    </div>
    <nav class="mobile-tabs">
      <a class="m-tab" href="overview.html">总览</a>
      <a class="m-tab" href="files.html">文件</a>
      <a class="m-tab" href="library.html">图库</a>
      <a class="m-tab" href="shares.html">共享</a>
      <a class="m-tab" href="settings.html">设置</a>
    </nav>
  </div>

  <div class="main-col">
    <header class="page-head">
      <div class="page-title-group">
        <h1>总览</h1>
        <p class="page-desc" id="ov-subtitle">服务器状态一览</p>
      </div>
    </header>

    <main class="page-content">
      <div class="ov-grid">
        <!-- A. 存储卡 -->
        <section class="card raised ov-storage" id="card-storage">
          <div class="card-head"><h2>存储</h2></div>
          <div id="storage-alert" class="alert-bar danger hidden">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
            存储空间即将用完，建议清理大文件或扩容磁盘
          </div>
          <div class="storage-body">
            <div class="ring" id="storage-ring">
              <svg viewBox="0 0 120 120">
                <circle class="ring-track" cx="60" cy="60" r="50"></circle>
                <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="50"
                        stroke-dasharray="314.16" stroke-dashoffset="314.16"></circle>
              </svg>
              <div class="ring-center">
                <div class="ring-pct" id="ring-pct">–</div>
                <div class="ring-label">已用</div>
              </div>
            </div>
            <div class="storage-detail" id="storage-detail">
              <div class="storage-row"><span class="k">总容量</span><span class="v" id="st-total">–</span></div>
              <div class="storage-row"><span class="k">已用</span><span class="v" id="st-used">–</span></div>
              <div class="storage-row"><span class="k">可用</span><span class="v" id="st-free">–</span></div>
            </div>
          </div>
        </section>

        <!-- B. 服务器信息卡 -->
        <section class="card ov-server" id="card-server">
          <div class="card-head"><h2>服务器</h2></div>
          <dl class="def-list" id="server-list">
            <dt>服务器名</dt><dd id="sv-name">–</dd>
            <dt>版本</dt><dd class="mono" id="sv-version">–</dd>
            <dt>存储根路径</dt><dd class="mono" id="sv-root">–</dd>
            <dt>本机地址</dt><dd><button class="copy-btn mono" id="sv-addr" title="点击复制">–</button></dd>
            <dt>Go 版本</dt><dd class="mono" id="sv-go">–</dd>
          </dl>
          <p style="margin:var(--sp-4) 0 0"><a class="btn ghost sm" href="settings.html">查看设置 →</a></p>
        </section>

        <!-- C/D/E 统计卡 -->
        <div class="ov-stat"><div class="ov-stat-inner">
          <section class="card interactive stat-card" id="stat-photos" role="button" tabindex="0">
            <span class="stat-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L6 21"/></svg></span>
            <span class="stat-num" id="stat-photos-num">–</span>
            <span class="stat-label">照片</span>
          </section>
          <section class="card interactive stat-card" id="stat-videos" role="button" tabindex="0">
            <span class="stat-icon"><svg class="icon" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></span>
            <span class="stat-num" id="stat-videos-num">–</span>
            <span class="stat-label">视频</span>
          </section>
          <section class="card interactive stat-card" id="stat-people" role="button" tabindex="0">
            <span class="stat-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>
            <span class="stat-num" id="stat-people-num">–</span>
            <span class="stat-label">人物</span>
            <span class="stat-sub" id="stat-people-sub"></span>
          </section>
        </div></div>

        <!-- F. 任务进度卡 -->
        <section class="card ov-tasks" id="card-tasks">
          <div class="card-head">
            <h2>后台任务</h2>
            <button class="icon-btn" id="btn-tasks-refresh" aria-label="全部刷新" title="全部刷新">
              <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
            </button>
          </div>
          <div id="tasks-list"></div>
          <div id="tasks-empty" class="empty hidden">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12.5l2 2 4-4.5"/></svg>
            <div class="empty-title">现在没有正在运行的任务，服务器很清闲</div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<div id="toast-stack"></div>

<script src="theme.js"></script>
<script src="overview.js"></script>
</body>
</html>
