<div class="main-col">
  <header class="page-head">
    <div class="page-title-group"><h1>设置</h1></div>
  </header>

  <main class="page-content">
    <div class="settings-stack content-slim" style="margin:0 auto">

      <!-- ① 服务器 -->
      <section class="card">
        <div class="card-head"><h2>服务器</h2></div>
        <div class="field-row">
          <label>服务器名</label>
          <p class="field-hint" id="server-name-text">加载中…</p>
        </div>
        <dl class="def-list">
          <dt>版本</dt><dd class="mono" id="sv-version">–</dd>
          <dt>存储根路径</dt><dd class="mono" id="sv-root">–</dd>
        </dl>
      </section>

      <!-- ② 修改密码（后端接口未提供，禁用态） -->
      <section class="card" id="password-card">
        <div class="card-head">
          <h2>修改密码</h2>
          <span class="badge neutral">即将上线</span>
        </div>
        <div class="inline-error hidden" id="pwd-error"></div>
        <div class="field-row">
          <label for="pwd-current">当前密码</label>
          <div class="pwd-wrap">
            <input type="password" id="pwd-current" class="input" autocomplete="current-password" disabled>
            <button type="button" class="pwd-eye" data-eye="pwd-current" aria-label="显示密码" disabled>
              <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field-row">
          <label for="pwd-new">新密码</label>
          <div class="pwd-wrap">
            <input type="password" id="pwd-new" class="input" autocomplete="new-password" disabled>
            <button type="button" class="pwd-eye" data-eye="pwd-new" aria-label="显示密码" disabled>
              <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-hint" id="pwd-strength">至少 8 位，包含字母与数字</p>
        </div>
        <div class="field-row">
          <label for="pwd-confirm">确认新密码</label>
          <div class="pwd-wrap">
            <input type="password" id="pwd-confirm" class="input" autocomplete="new-password" disabled>
            <button type="button" class="pwd-eye" data-eye="pwd-confirm" aria-label="显示密码" disabled>
              <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-hint err hidden" id="pwd-mismatch">两次输入的密码不一致</p>
        </div>
        <button id="btn-pwd-save" class="btn primary" disabled>确认修改</button>
      </section>

      <!-- ③ 外观 -->
      <section class="card">
        <div class="card-head"><h2>主题</h2></div>
        <div class="tabs segmented" id="theme-seg" role="radiogroup" aria-label="主题">
          <button class="tab" data-theme-opt="auto" role="radio">
            <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            跟随系统
          </button>
          <button class="tab" data-theme-opt="light" role="radio">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            浅色
          </button>
          <button class="tab" data-theme-opt="dark" role="radio">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            深色
          </button>
        </div>
        <p class="field-hint" style="margin-top:var(--sp-3)">跟随系统时，将随系统外观自动切换</p>
      </section>

    </div>
  </main>
</div>

<div id="toast-stack"></div>

<script src="theme.js"></script>
<script src="settings.js"></script>
