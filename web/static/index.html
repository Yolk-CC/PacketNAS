<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketNAS 文件管理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录视图 -->
<div id="login-view" class="view hidden">
  <div class="login-card">
    <h1>PocketNAS</h1>
    <p class="muted">请输入访问密码</p>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="密码" autocomplete="current-password" required>
      <button type="submit" class="btn primary">登录</button>
    </form>
    <p id="login-error" class="error-text hidden"></p>
  </div>
</div>

<!-- 主视图 -->
<div id="main-view" class="view hidden">
  <header class="topbar">
    <div class="brand">PocketNAS</div>
    <nav class="tabs">
      <a class="tab active" href="index.html">文件</a>
      <a class="tab" href="gallery.html">相册</a>
    </nav>
    <nav id="breadcrumb" class="breadcrumb"></nav>
    <div class="actions">
      <select id="type-filter" title="类型筛选">
        <option value="all">全部</option>
        <option value="image">图片</option>
        <option value="video">视频</option>
      </select>
      <button id="btn-upload" class="btn">上传</button>
      <button id="btn-mkdir" class="btn">新建文件夹</button>
      <button id="btn-logout" class="btn subtle">退出</button>
    </div>
  </header>

  <main id="list-area" class="list-area">
    <div id="drop-hint" class="drop-hint hidden">松开以上传到当前目录</div>
    <div class="table-wrap">
      <table class="file-table">
        <thead>
          <tr><th>名称</th><th>大小</th><th>修改时间</th><th class="ops-col">操作</th></tr>
        </thead>
        <tbody id="file-list"></tbody>
      </table>
    </div>
    <p id="empty-hint" class="muted center hidden">此目录为空，拖拽文件到此处上传</p>
  </main>

  <footer class="statusbar"><span id="sysinfo"></span></footer>
  <input type="file" id="file-input" multiple hidden>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
